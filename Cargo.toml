[package]
name = "aqua-prana-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
async-openai = "0.41.3"
axum = "0.7"
chrono = "0.4.45"
dotenvy = "0.15.7"
jsonwebtoken = "11.0.0"
oauth2 = "5.0.0"
rand = "0.10.2"
redis = { version = "1.7.0", features = ["tokio-comp"] }
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "rust_decimal", "chrono", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tower-sessions = "0.15.0"
tower-sessions-redis-store = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4"] }
